<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Onboarding</title><style>
body{font-family:Arial,sans-serif;background:#f3f6fb;margin:0;color:#172033}main{max-width:760px;margin:35px auto;background:white;padding:28px;border-radius:14px;box-shadow:0 5px 24px #0001}h1{color:#183b67}label{display:block;margin-top:12px;font-weight:600}input,textarea,select{box-sizing:border-box;width:100%;padding:10px;margin-top:5px;border:1px solid #ccd4df;border-radius:7px}button{margin-top:18px;padding:11px 18px;background:#1769aa;color:white;border:0;border-radius:7px;cursor:pointer}.muted{color:#667085;font-size:14px}.result{white-space:pre-wrap;background:#f5f8fc;padding:12px;border-radius:8px;margin-top:12px}
</style></head><body><main><h1>AI Resume Parser & Secure Onboarding</h1><p class="muted">Upload a resume to prefill your registration details.</p>
<label>Resume (PDF/DOCX)</label><input type="file" id="resume"><button onclick="parseResume()">Parse Resume</button>
<div id="parsed" class="result">Parsed details will appear here.</div>
<h2>Registration</h2><label>Name</label><input id="name"><label>Email</label><input id="email" type="email"><label>Phone</label><input id="phone"><label>Skills (comma separated)</label><input id="skills"><label>Qualification</label><input id="qualification"><label>Experience</label><textarea id="experience"></textarea><label>Password</label><input id="password" type="password"><label>2FA channel</label><select id="channel"><option value="email">Email OTP</option><option value="whatsapp">WhatsApp OTP</option><option value="browser">Browser OTP</option></select>
<button onclick="register()">Register</button><h2>Verify OTP</h2><label>OTP</label><input id="otp"><button onclick="verify()">Verify & Activate</button><div id="status" class="result"></div></main>
<script>
let token="";
async function parseResume(){let f=document.getElementById('resume').files[0];if(!f)return alert('Choose a PDF or DOCX');let d=new FormData();d.append('file',f);let r=await fetch('/api/v1/resume/parse',{method:'POST',body:d});let j=await r.json();document.getElementById('parsed').textContent=JSON.stringify(j.data||j,null,2);if(j.data){for(let k of ['name','email','phone','qualification','experience'])if(j.data[k])document.getElementById(k).value=j.data[k];document.getElementById('skills').value=(j.data.skills||[]).join(', ')}}
async function register(){let val=id=>document.getElementById(id).value;let p={name:val('name'),email:val('email'),phone:val('phone')||null,password:val('password'),skills:val('skills').split(',').map(x=>x.trim()).filter(Boolean),qualification:val('qualification')||null,experience:val('experience')||null,channel:val('channel')};let r=await fetch('/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});document.getElementById('status').textContent=JSON.stringify(await r.json(),null,2)}
async function verify(){let val=id=>document.getElementById(id).value;let r=await fetch('/api/v1/auth/verify-2fa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:val('email'),channel:val('channel'),otp:val('otp')})});let j=await r.json();token=j.access_token||'';document.getElementById('status').textContent=JSON.stringify(j,null,2);if(token)location.href='/dashboard/student'}
</script></body></html>
